name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  semgrep-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - run: echo semgrep > requirements.txt

      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
          cache: 'pip'

      - name: Install Semgrep
        run: pip install -r requirements.txt

      - name: Install Opengrep
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(gh release view --repo opengrep/opengrep --json tagName --jq .tagName)
          install_dir="$HOME/.local/bin"
          mkdir -p "$install_dir"
          gh release download "$version" --repo opengrep/opengrep \
            --pattern opengrep_manylinux_x86 --output "$install_dir/opengrep"
          chmod +x "$install_dir/opengrep"
          echo "$install_dir" >> "$GITHUB_PATH"

      - name: Verify scanners
        run: |
          semgrep --version
          opengrep --version

      - name: Verify scanner rules have test files
        run: node scripts/verify-semgrep-tests.cjs

      - name: Test rules with their configured scanner
        run: node scripts/run-semgrep-rule-tests.cjs
